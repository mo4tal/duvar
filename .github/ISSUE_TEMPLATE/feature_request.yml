name: Feature Request
description: Suggest an improvement or new capability for Duvar
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Motivation
      description: What problem does this solve or what experience would it improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe how you envision this working within GNOME / Adwaita HIG.
    validations:
      required: false
