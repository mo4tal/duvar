[package]
name = "duvar"
version = "0.6.0"
edition = "2024"
rust-version = "1.88"
authors = ["mo4tal <225280905+mo4tal@users.noreply.github.com>"]
description = "Multi-source wallpaper gallery and adaptive OKLab color engine for GNOME Shell 51"
repository = "https://github.com/mo4tal/duvar"
readme = "README.md"
license = "GPL-3.0-or-later"
keywords = ["gnome", "gnome-shell", "wallpaper", "adwaita", "gtk4"]
categories = ["gui", "multimedia"]
publish = false

[lib]
name = "duvar_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
gtk = { package = "gtk4", version = "0.10", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.8", features = ["v1_6"] }
gio = "0.21"
glib = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
url = "2"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
