<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="48%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f2937"/>
    </linearGradient>
    <radialGradient id="glow1" cx="22%" cy="35%" r="48%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="82%" cy="62%" r="46%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="55%" cy="18%" r="40%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iconSky" x1="0" y1="0" x2="1" y2="0.85">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="52%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="iconMtn1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="iconMtn2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.48"/>
    </filter>
    <clipPath id="bannerClip">
      <rect width="1200" height="320" rx="28"/>
    </clipPath>
    <clipPath id="canvasClip">
      <rect x="14" y="14" width="128" height="96" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#bannerClip)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#glow1)"/>
    <rect width="1200" height="320" fill="url(#glow2)"/>
    <rect width="1200" height="320" fill="url(#glow3)"/>

    <!-- Subtle floating glass top-bar motif across the banner -->
    <g opacity="0.92">
      <rect x="44" y="24" width="54" height="22" rx="11" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.22"/>
      <rect x="55" y="32" width="18" height="6" rx="3" fill="#f8fafc"/>
      <circle cx="82" cy="35" r="3" fill="#f8fafc" opacity="0.55"/>

      <rect x="536" y="24" width="128" height="22" rx="11" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.22"/>
      <text x="600" y="39" text-anchor="middle" font-family="Cantarell, Inter, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#f8fafc" letter-spacing="0.4">GNOME Shell 51</text>

      <rect x="1084" y="24" width="72" height="22" rx="11" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.22"/>
      <circle cx="1104" cy="35" r="3.5" fill="#f87171"/>
      <circle cx="1120" cy="35" r="3.5" fill="#34d399"/>
      <circle cx="1136" cy="35" r="3.5" fill="#60a5fa"/>
    </g>

    <!-- Crisp Adwaita App Icon -->
    <g transform="translate(116, 92)" filter="url(#shadow)">
      <rect x="0" y="6" width="156" height="128" rx="22" fill="#94a3b8"/>
      <rect x="0" y="0" width="156" height="124" rx="22" fill="url(#frame)"/>
      <g clip-path="url(#canvasClip)">
        <rect x="14" y="14" width="128" height="96" fill="url(#iconSky)"/>
        <!-- Sun + Moon -->
        <circle cx="48" cy="48" r="14" fill="#fde68a"/>
        <circle cx="116" cy="48" r="10" fill="#eef2ff"/>
        <circle cx="120" cy="45" r="8.5" fill="#2c296b"/>
        <!-- Mini capsules -->
        <rect x="20" y="20" width="24" height="8" rx="4" fill="#ffffff" fill-opacity="0.72"/>
        <rect x="64" y="20" width="28" height="8" rx="4" fill="#ffffff" fill-opacity="0.72"/>
        <rect x="112" y="20" width="24" height="8" rx="4" fill="#0f172a" fill-opacity="0.65"/>
        <!-- Mountains -->
        <path d="M10 112 L52 60 L96 112 Z" fill="url(#iconMtn1)"/>
        <path d="M62 112 L106 54 L148 112 Z" fill="url(#iconMtn2)"/>
      </g>
      <!-- Palette pill -->
      <rect x="78" y="96" width="84" height="36" rx="18" fill="#cbd5e1"/>
      <rect x="78" y="92" width="84" height="34" rx="17" fill="#ffffff"/>
      <circle cx="99" cy="109" r="8.5" fill="#fb7185"/>
      <circle cx="120" cy="109" r="8.5" fill="#34d399"/>
      <circle cx="141" cy="109" r="8.5" fill="#6366f1"/>
    </g>

    <!-- Title + Subtitle + Pill Chips -->
    <g transform="translate(316, 128)">
      <text x="0" y="28" font-family="Cantarell, Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Duvar</text>
      <text x="2" y="66" font-family="Cantarell, Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="21" font-weight="400" fill="#cbd5e1">Adaptive OKLab Color Engine &amp; Native Rust Wallpaper Gallery for GNOME</text>

      <!-- Feature pills -->
      <g transform="translate(0, 92)" font-family="Cantarell, Inter, sans-serif" font-size="13" font-weight="600">
        <rect x="0" y="0" width="146" height="32" rx="16" fill="#38bdf8" fill-opacity="0.16" stroke="#38bdf8" stroke-opacity="0.45"/>
        <text x="73" y="20.5" text-anchor="middle" fill="#bae6fd">Rust + GTK 4 / Adw</text>

        <rect x="158" y="0" width="152" height="32" rx="16" fill="#34d399" fill-opacity="0.16" stroke="#34d399" stroke-opacity="0.45"/>
        <text x="234" y="20.5" text-anchor="middle" fill="#a7f3d0">Floating Capsules</text>

        <rect x="322" y="0" width="132" height="32" rx="16" fill="#a78bfa" fill-opacity="0.16" stroke="#a78bfa" stroke-opacity="0.45"/>
        <text x="388" y="20.5" text-anchor="middle" fill="#ddd6fe">12 Sources</text>

        <rect x="466" y="0" width="140" height="32" rx="16" fill="#fb7185" fill-opacity="0.16" stroke="#fb7185" stroke-opacity="0.45"/>
        <text x="536" y="20.5" text-anchor="middle" fill="#fecdd3">10 Languages</text>
      </g>
    </g>

    <!-- Subtle inner border -->
    <rect x="1" y="1" width="1198" height="318" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
  </g>
</svg>
