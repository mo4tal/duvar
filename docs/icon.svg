<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <filter id="orbGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dotShadow" x="-25%" y="-25%" width="150%" height="165%">
      <feDropShadow dx="0" dy="2.2" stdDeviation="1.8" flood-color="#000000" flood-opacity="0.30"/>
    </filter>

    <linearGradient id="frameSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3d3846"/>
      <stop offset="10%" stop-color="#5e5c64"/>
      <stop offset="50%" stop-color="#4a4654"/>
      <stop offset="90%" stop-color="#5e5c64"/>
      <stop offset="100%" stop-color="#2e2a36"/>
    </linearGradient>
    <linearGradient id="frameFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#deddda"/>
      <stop offset="6%" stop-color="#f6f5f4"/>
      <stop offset="94%" stop-color="#d5d3cf"/>
      <stop offset="100%" stop-color="#b9b6b0"/>
    </linearGradient>

    <linearGradient id="skyGrad" x1="0.06" y1="0.04" x2="0.94" y2="0.96">
      <stop offset="0%" stop-color="#3584e4"/>
      <stop offset="38%" stop-color="#62a0ea"/>
      <stop offset="68%" stop-color="#7c63c9"/>
      <stop offset="100%" stop-color="#2a214a"/>
    </linearGradient>
    <radialGradient id="sunHaze" cx="0.28" cy="0.40" r="0.46">
      <stop offset="0%" stop-color="#f9f06b" stop-opacity="0.54"/>
      <stop offset="45%" stop-color="#ffbe6f" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffbe6f" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="mtnFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b5494"/>
      <stop offset="100%" stop-color="#362f63"/>
    </linearGradient>
    <linearGradient id="mtnMid" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#2ec27e"/>
      <stop offset="48%" stop-color="#218c74"/>
      <stop offset="100%" stop-color="#194a59"/>
    </linearGradient>
    <linearGradient id="mtnFront" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c4057"/>
      <stop offset="60%" stop-color="#1d2b45"/>
      <stop offset="100%" stop-color="#181c30"/>
    </linearGradient>

    <linearGradient id="orbGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff6b8"/>
      <stop offset="52%" stop-color="#f8e45c"/>
      <stop offset="100%" stop-color="#ffa348"/>
    </linearGradient>
    <linearGradient id="glassSheen" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="pillLip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c0bfbc"/>
      <stop offset="100%" stop-color="#9a9996"/>
    </linearGradient>
    <linearGradient id="swatchCoral" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8924"/>
      <stop offset="100%" stop-color="#e01b24"/>
    </linearGradient>
    <linearGradient id="swatchMint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#57e389"/>
      <stop offset="100%" stop-color="#26a269"/>
    </linearGradient>
    <linearGradient id="swatchViolet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#99c1f1"/>
      <stop offset="45%" stop-color="#62a0ea"/>
      <stop offset="100%" stop-color="#813d9c"/>
    </linearGradient>

    <clipPath id="screenClip">
      <rect x="18" y="24" width="92" height="76" rx="9" ry="9"/>
    </clipPath>
  </defs>

  <!-- 1. Extruded 3D bottom lip -->
  <rect x="10" y="24" width="108" height="90" rx="16" ry="16" fill="url(#frameSide)" filter="url(#dropShadow)"/>

  <!-- 2. Main Adwaita rounded bezel -->
  <rect x="10" y="16" width="108" height="92" rx="16" ry="16" fill="url(#frameFace)"/>
  <rect x="10.75" y="16.75" width="106.5" height="90.5" rx="15.25" ry="15.25"
        fill="none" stroke="#ffffff" stroke-opacity="0.72" stroke-width="1.5"/>

  <!-- 3. Inner day-to-night wallpaper canvas -->
  <g clip-path="url(#screenClip)">
    <rect x="18" y="24" width="92" height="76" fill="url(#skyGrad)"/>
    <rect x="18" y="24" width="92" height="76" fill="url(#sunHaze)"/>

    <!-- Night-side stars & crisp crescent moon accent -->
    <circle cx="88" cy="43" r="1.2" fill="#ffffff" fill-opacity="0.86"/>
    <circle cx="97.5" cy="39.5" r="0.9" fill="#ffffff" fill-opacity="0.68"/>
    <circle cx="79.5" cy="38.5" r="0.85" fill="#ffffff" fill-opacity="0.58"/>
    <path d="M 94.5 46.5 A 5.4 5.4 0 1 0 100.8 53.2 A 4.4 4.4 0 1 1 94.5 46.5 Z"
          fill="#f6f5f4" fill-opacity="0.88"/>

    <!-- Day-side warm luminous sun -->
    <g filter="url(#orbGlow)">
      <circle cx="42" cy="51.5" r="10.2" fill="url(#orbGrad)"/>
    </g>

    <!-- Layered Adwaita mountains -->
    <path d="M 14 84 L 46 60 Q 52 55.5 58 60 L 82 77 L 95 66 Q 100 62 105 66 L 114 74 L 114 104 L 14 104 Z"
          fill="url(#mtnFar)"/>
    <path d="M 14 88 L 36 69 Q 42 64 48 69 L 76 92 L 114 104 L 14 104 Z"
          fill="url(#mtnMid)"/>
    <path d="M 44 104 L 74 73 Q 80 67 86 73 L 114 96 L 114 104 Z"
          fill="url(#mtnFront)"/>

    <!-- Signature floating glass top-bar capsules -->
    <g>
      <rect x="22.5" y="28" width="16" height="6.5" rx="3.25" fill="#ffffff" fill-opacity="0.72"/>
      <rect x="25.2" y="30.25" width="6.5" height="2" rx="1" fill="#1e2433" fill-opacity="0.85"/>
      <circle cx="34.8" cy="31.25" r="1.15" fill="#1e2433" fill-opacity="0.52"/>

      <rect x="52" y="28" width="24" height="6.5" rx="3.25" fill="#f6f5f4" fill-opacity="0.76"/>
      <rect x="57" y="30.25" width="14" height="2" rx="1" fill="#1e2433" fill-opacity="0.82"/>

      <rect x="88" y="28" width="17.5" height="6.5" rx="3.25" fill="#1d1f2b" fill-opacity="0.66"/>
      <circle cx="92.8" cy="31.25" r="1.25" fill="#f6f5f4" fill-opacity="0.92"/>
      <circle cx="96.8" cy="31.25" r="1.25" fill="#f6f5f4" fill-opacity="0.92"/>
      <circle cx="100.8" cy="31.25" r="1.25" fill="#f6f5f4" fill-opacity="0.92"/>
    </g>

    <rect x="18" y="24" width="92" height="76" fill="url(#glassSheen)"/>
  </g>

  <rect x="18" y="24" width="92" height="76" rx="9" ry="9"
        fill="none" stroke="#1e1b29" stroke-opacity="0.22" stroke-width="1.2"/>

  <!-- 4. Overlapping tactile palette swatch pill badge -->
  <g filter="url(#dotShadow)">
    <!-- Subtle 3D bottom lip on the pill tray -->
    <rect x="64" y="90.2" width="54" height="27" rx="13.5" ry="13.5" fill="url(#pillLip)"/>
    <!-- Crisp frosted pill tray -->
    <rect x="64" y="88" width="54" height="27" rx="13.5" ry="13.5" fill="#f6f5f4"/>
    <rect x="64.75" y="88.75" width="52.5" height="25.5" rx="12.75" ry="12.75"
          fill="none" stroke="#ffffff" stroke-opacity="0.90" stroke-width="1.2"/>
    <!-- 3 crisp, well-spaced extracted palette beads -->
    <circle cx="76.5" cy="101.5" r="6.4" fill="url(#swatchCoral)"/>
    <circle cx="91.0" cy="101.5" r="6.4" fill="url(#swatchMint)"/>
    <circle cx="105.5" cy="101.5" r="6.4" fill="url(#swatchViolet)"/>
    <!-- Specular bead highlights -->
    <circle cx="74.7" cy="99.3" r="1.8" fill="#ffffff" fill-opacity="0.40"/>
    <circle cx="89.2" cy="99.3" r="1.8" fill="#ffffff" fill-opacity="0.40"/>
    <circle cx="103.7" cy="99.3" r="1.8" fill="#ffffff" fill-opacity="0.40"/>
  </g>
</svg>
